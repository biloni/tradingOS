[project]
name = "tradingos-api"
version = "0.1.0"
description = "TradingOS API: FastAPI backend for market data, paper portfolio, scoring, and backtesting."
readme = "README.md"
authors = [
    { name = "biloni", email = "bilonikadakia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "alpaca-py==0.43.5",
    "anthropic==0.120.2",
    # Revision Prompt 8's CSV import endpoint accepts a multipart file
    # upload (`fastapi.UploadFile`) — FastAPI requires this at runtime
    # for any Form/UploadFile parameter, even though nothing here
    # imports it directly.
    "python-multipart==0.0.32",
]

[project.scripts]
tradingos-api = "tradingos_api:main"
tradingos-seed = "tradingos_api.scripts.seed_phase8:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.9.1",
    "ruff==0.16.1",
    "mypy==2.3.0",
    # Revision Prompt 5's "compare indicator outputs with an approved
    # trusted library" test only — never imported by production code.
    # services/analytics.py itself is pure Python + decimal.Decimal
    # (no numpy/pandas runtime dependency), matching this project's
    # existing never-float-for-computed-precision discipline.
    "ta==0.11.0",
    "pandas==3.0.5",
    "numpy==2.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (`param: T = Depends(...)`) is a
# call-in-default-argument by design, not the mutable-default-argument
# bug B008 exists to catch (docs/DECISIONS.md — Phase 8 routers use this
# pattern throughout: get_db, get_current_user_id, get_broker_provider,
# get_llm_provider).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
