services:
  postgres:
    image: postgres:16
    container_name: tradingos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradingos_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or a .env file next to this compose file}
      POSTGRES_DB: tradingos
    ports:
      - "5432:5432"
    volumes:
      - tradingos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingos_app -d tradingos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations, then exits. `api` waits for it to exit
  # 0 (service_completed_successfully) before starting — no application
  # code runs `alembic upgrade head` on its own startup (Revision Prompt
  # 16, task: Dockerfiles + docker-compose + deployment docs; the
  # backend never automated this itself, see docs/OPERATIONS.md).
  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tradingos-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tradingos_app:${POSTGRES_PASSWORD}@postgres:5432/tradingos
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: tradingos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://tradingos_app:${POSTGRES_PASSWORD}@postgres:5432/tradingos
      # The web container is on this same Docker network, but a real
      # browser connecting to the web container's own published port is
      # not — this needs the origin the browser actually loads the web
      # app from, not the internal service hostname.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Baked into the client JS bundle at build time (Next.js
        # NEXT_PUBLIC_* semantics) — must be the origin a real browser
        # can reach, i.e. this compose file's own published `api` port,
        # not the internal `http://api:8000` service hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: tradingos-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  tradingos-postgres-data:
